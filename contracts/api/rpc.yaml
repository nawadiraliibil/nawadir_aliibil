    idempotency: "محادثة واحدة لكل إعلان وطرفين؛ التكرار يعيد الموجودة (created=false)."
    requirement: "AD-FR-031"
    since: "0.3.0"
  start_listing_edit:
    description: "بدء تعديل إعلان منشور أو مرفوض أو مؤرشف بنسخة مسودة جديدة."
    access: "user"
    arguments: "p_listing_id uuid"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, ACCOUNT_SUSPENDED, NOT_FOUND, INVALID_STATE]
