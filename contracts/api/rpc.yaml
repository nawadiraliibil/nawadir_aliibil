# دوال الخلفية المتاحة عبر PostgREST (‎/rest/v1/rpc/<name>).
# مولد من القاعدة المحلية بالسكربت contracts/tools/build_rpc.mjs؛ لا يعدل يدويًا.
#
# access:
#   anon                 الزائر والمستخدم
#   user                 مستخدم مسجل بحساب هاتف
#   staff                أي موظف فعال بجلسة aal2
#   staff:<capability>   موظف يملك القدرة (المدير يملك كل القدرات)
#   service              دور الخادم فقط؛ لا يستدعيها العميل
# الأخطاء: الرمز في message والتفاصيل JSON في details بحالة SQL ‏P0001؛
# انظر api/errors.json. الرد jsonb ما لم يذكر غير ذلك.

version: "1.4.0"
functions:
  accept_policies:
    description: "تسجيل موافقة صاحب الجلسة على نصوص سارية. تكرار الطلب لا يغير تاريخ الموافقة."
    access: "user"
    arguments: "p_document_ids integer[]"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, VALIDATION_FAILED]
    idempotency: "تكرار الموافقة على النص نفسه لا يغير تاريخها."
    requirement: "AD-FR-003"
    since: "0.1.0"
  add_favorite:
    description: "يحفظ إعلانًا منشورًا في مفضلة صاحب الجلسة. التكرار آمن."
    access: "user"
    arguments: "p_listing_id uuid"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, ACCOUNT_SUSPENDED, NOT_FOUND]
    idempotency: "التكرار لا ينشئ صفًا ولا يغير تاريخ الحفظ."
    requirement: "AD-FR-022"
    since: "0.2.0"
  add_listing_media:
    description: "تسجيل ملف وسائط بانتظار الرفع في مسودة. يعيد bucket والمسار للرفع عبر واجهة التخزين."
    access: "user"
    arguments: "p_listing_id uuid, p_kind media_kind, p_mime_type text, p_size_bytes bigint"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, ACCOUNT_SUSPENDED, NOT_FOUND, INVALID_STATE, VALIDATION_FAILED, VIDEO_DISABLED, MEDIA_LIMIT_REACHED]
    note: "بعد الرفع إلى المسار المعاد يستدعي العميل دالة Edge ‏media-finalize."
    requirement: "AD-FR-007"
    since: "0.1.0"
  admin_approve_listing_version:
    description: "مهملة (TEAM-DEC-013): لا مراجعة قبل النشر؛ ترفع INVALID_STATE دائمًا. تبقى لعدم كسر السطح."
    access: "staff:listings.review"
    arguments: "p_listing_id uuid, p_version_id uuid, p_content_hash text"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, MFA_REQUIRED, NOT_FOUND, INVALID_STATE, VERSION_CHANGED, AUCTION_TIME_PASSED]
    note: "مهملة منذ 1.2.0 (TEAM-DEC-013): ترفع INVALID_STATE دائمًا (الإعلان ينشر عند الإرسال)."
    requirement: "AD-FR-008، AD-FR-009"
    since: "0.1.0"
  admin_assign_report:
    description: "يسند بلاغًا إلى مسؤول ويجعله قيد المراجعة. القدرة: reports.handle."
    access: "staff:reports.handle"
    arguments: "p_report_id uuid, p_assignee uuid DEFAULT NULL::uuid"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, MFA_REQUIRED, NOT_FOUND, INVALID_STATE, VALIDATION_FAILED]
    requirement: "AD-FR-019"
    since: "0.3.0"
  admin_close_report:
    description: "يغلق بلاغًا بسبب وردّ للمبلغ وملاحظة داخلية، ويُشعر المبلغ. القدرة: reports.handle."
    access: "staff:reports.handle"
    arguments: "p_report_id uuid, p_close_reason text, p_response_text text DEFAULT NULL::text, p_internal_note text DEFAULT NULL::text"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, MFA_REQUIRED, NOT_FOUND, INVALID_STATE, REASON_REQUIRED, VALIDATION_FAILED]
    requirement: "AD-FR-019"
    since: "0.3.0"
  admin_decide_rating_appeal:
    description: "قرار الإدارة في اعتراض على تقييم: القبول يخفيه بسبب، والرفض يبقيه. القدرة: ratings.moderate."
    access: "staff:ratings.moderate"
    arguments: "p_appeal_id uuid, p_decision text, p_reason_code text DEFAULT NULL::text, p_note text DEFAULT NULL::text"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, MFA_REQUIRED, NOT_FOUND, INVALID_STATE, REASON_REQUIRED, VALIDATION_FAILED]
    note: "p_decision: ACCEPTED يخفي التقييم بسبب إلزامي (RATING_HIDE)، REJECTED يبقيه."
    requirement: "AD-FR-036"
    since: "1.0.0"
  admin_get_account:
    description: "تفاصيل حساب مستخدم مع هاتف الدخول وعدد إعلاناته بحسب الحالة. القدرة: accounts.manage."
    access: "staff:accounts.manage"
    arguments: "p_user_id uuid"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, MFA_REQUIRED, NOT_FOUND]
    requirement: "AD-FR-018"
    since: "0.1.0"
  admin_get_listing_review:
    description: "تفاصيل إعلان للمراجعة مع بصمة النسخة. القدرة: listings.review أو listings.hide."
    access: "staff:listings.review|listings.hide"
    arguments: "p_listing_id uuid"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, MFA_REQUIRED, NOT_FOUND]
    requirement: "AD-FR-008، AD-FR-018"
    since: "0.1.0"
  admin_get_report_evidence:
    description: "الرسالة أو الرد المبلّغ عنه وسياق محدود، بتسجيل الاطلاع. القدرة: evidence.read."
    access: "staff:evidence.read"
    arguments: "p_report_id uuid"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, MFA_REQUIRED, NOT_FOUND, INVALID_STATE]
    note: "تسجل كل قراءة ناجحة في report_evidence_access وسجل الإجراءات."
    requirement: "AD-FR-036"
    since: "0.3.0"
  admin_get_settings:
    description: "الإصدار المنشور ومسودة التعديل. القدرة: settings.manage."
    access: "staff:settings.manage"
    arguments: ""
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, MFA_REQUIRED]
    requirement: "AD-FR-037"
    since: "0.1.0"
  admin_grant_role:
    description: "منح دور لحساب موظف أو تعديله. القدرة: staff.manage."
    access: "staff:staff.manage"
    arguments: "p_user_id uuid, p_role staff_role, p_capabilities text[] DEFAULT ARRAY[]::text[]"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, MFA_REQUIRED, CANNOT_MODIFY_SELF, VALIDATION_FAILED, LAST_ADMIN]
    requirement: "AD-FR-021"
    since: "0.1.0"
  admin_hide_comment:
    description: "إخفاء رد مخالف بسبب إلزامي. القدرة: comments.moderate."
    access: "staff:comments.moderate"
    arguments: "p_comment_id uuid, p_reason_code text, p_reason_text text DEFAULT NULL::text"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, MFA_REQUIRED, NOT_FOUND, INVALID_STATE, REASON_REQUIRED, VALIDATION_FAILED]
    requirement: "AD-FR-032، AD-FR-036"
    since: "0.3.0"
  admin_hide_listing:
    description: "إخفاء إعلان منشور بسبب إلزامي. يسري على القراءة والوسائط من الطلب التالي. القدرة: listings.hide."
    access: "staff:listings.hide"
    arguments: "p_listing_id uuid, p_reason_code text, p_reason_text text DEFAULT NULL::text"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, MFA_REQUIRED, REASON_REQUIRED, VALIDATION_FAILED, NOT_FOUND, INVALID_STATE]
    requirement: "AD-FR-018"
    since: "0.1.0"
  admin_hide_rating:
    description: "إخفاء تقييم مخالف بسبب إلزامي؛ يخرج من العرض والمتوسط. القدرة: ratings.moderate."
    access: "staff:ratings.moderate"
    arguments: "p_rating_id uuid, p_reason_code text, p_reason_text text DEFAULT NULL::text"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, MFA_REQUIRED, NOT_FOUND, INVALID_STATE, REASON_REQUIRED, VALIDATION_FAILED]
    requirement: "AD-FR-036"
    since: "1.0.0"
  admin_list_listings:
    description: "قائمة كل الإعلانات للتحكم بالظهور: تصفية بالحالة وبحث نصي، الأحدث تغيّرًا أولًا. القدرة: listings.hide أو listings.review."
    access: "staff:listings.hide|listings.review"
    arguments: "p_status text DEFAULT NULL::text, p_query text DEFAULT NULL::text, p_limit integer DEFAULT 50, p_after_changed_at timestamp with time zone DEFAULT NULL::timestamp with time zone, p_after_id uuid DEFAULT NULL::uuid"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, MFA_REQUIRED, VALIDATION_FAILED]
    note: "قائمة كل الإعلانات لإدارة الظهور: p_status (DRAFT|PUBLISHED|HIDDEN|ARCHIVED|REJECTED أو فارغ)، p_query (جزء من العنوان أو اسم المعلن، أو المعرف العام public_ref أو معرف الإعلان)، p_limit (1-100، 50)، والتصفح بمفتاح آخر عنصر (p_after_changed_at, p_after_id) بترتيب status_changed_at تنازليًا. العنصر يضم listing_id وpublic_ref وstatus وtitle وowner_display_name وowner_status وhide_reason_code وhide_reason_text وhidden_at وغيرها."
    requirement: "AD-FR-018"
    since: "1.2.0"
  admin_publish_settings:
    description: "نشر مسودة الإعدادات بإصدار جديد. ذري مع حدود التخزين. القدرة: settings.manage."
    access: "staff:settings.manage"
    arguments: "p_note text DEFAULT NULL::text"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, MFA_REQUIRED, INVALID_STATE, VALIDATION_FAILED, BELOW_HARD_MINIMUM]
    requirement: "AD-FR-037"
    since: "0.1.0"
  admin_reactivate_account:
    description: "إعادة تفعيل حساب معلق دون إعادة نشر إعلاناته. القدرة: accounts.manage."
    access: "staff:accounts.manage"
    arguments: "p_user_id uuid, p_note text DEFAULT NULL::text"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, MFA_REQUIRED, NOT_FOUND, INVALID_STATE, VALIDATION_FAILED]
    requirement: "AD-FR-018"
    since: "0.1.0"
  admin_reject_listing_version:
    description: "مهملة (TEAM-DEC-013): لا رفض؛ ترفع INVALID_STATE دائمًا. الإخفاء وحده أداة التحكم."
    access: "staff:listings.review"
    arguments: "p_listing_id uuid, p_version_id uuid, p_content_hash text, p_reason_code text, p_reason_text text DEFAULT NULL::text"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, MFA_REQUIRED, REASON_REQUIRED, VALIDATION_FAILED, NOT_FOUND, INVALID_STATE, VERSION_CHANGED]
    note: "مهملة منذ 1.2.0 (TEAM-DEC-013): ترفع INVALID_STATE دائمًا؛ الإخفاء admin_hide_listing هو أداة التحكم."
    requirement: "AD-FR-008، AD-FR-018"
    since: "0.1.0"
  admin_reorder_lookup:
    description: "ترتيب قيم قائمة بحسب تسلسل المعرفات المرسلة. القدرة: lookups.manage."
    access: "staff:lookups.manage"
    arguments: "p_kind text, p_ids text[]"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, MFA_REQUIRED, VALIDATION_FAILED, NOT_FOUND]
    requirement: "AD-FR-037"
    since: "0.1.0"
  admin_review_queue:
    description: "مهملة (TEAM-DEC-013): تعيد مصفوفة فارغة دائمًا لأنه لا إعلان قيد المراجعة. استخدم admin_list_listings."
    access: "staff:listings.review"
    arguments: "p_limit integer DEFAULT 50, p_after_changed_at timestamp with time zone DEFAULT NULL::timestamp with time zone, p_after_id uuid DEFAULT NULL::uuid"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, MFA_REQUIRED]
    note: "مهملة منذ 1.2.0 (TEAM-DEC-013): تعيد [] دائمًا؛ لا إعلان قيد المراجعة. استخدم admin_list_listings."
    requirement: "AD-FR-008"
    since: "0.1.0"
  admin_revoke_role:
    description: "سحب دور موظف. يسري في استدعائه التالي. القدرة: staff.manage."
