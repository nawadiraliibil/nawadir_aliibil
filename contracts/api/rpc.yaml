    requirement: "AD-FR-009، AD-FR-010"
    since: "0.1.0"
  storage_object_is_public:
    description: "هل ملف التخزين وسيط جاهز في النسخة المعتمدة لإعلان منشور. تستخدمها سياسات التخزين."
    access: "anon"
    arguments: "p_bucket text, p_name text"
    returns: "boolean"
    errors: []
    note: "تستخدمها سياسات التخزين؛ لا حاجة للعميل إلى استدعائها."
    requirement: "AD-NFR-002"
    since: "0.1.0"
  submit_listing:
    description: "إرسال المسودة وينشرها مباشرة (لا مراجعة). يعيد الإعلان بحالة PUBLISHED وإصدار النسخة APPROVED؛ تعديل المنشور يسري فورًا. إعادة الطلب بالمعرف نفسه لا تنشئ إرسالًا ثانيًا."
    access: "user"
    arguments: "p_listing_id uuid, p_request_id uuid"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, ACCOUNT_SUSPENDED, NOT_FOUND, PROFILE_INCOMPLETE, POLICIES_NOT_ACCEPTED, INVALID_STATE, MEDIA_NOT_READY, VALIDATION_FAILED, RATE_LIMITED]
    idempotency: "p_request_id: الطلب المكرر لا ينشئ إرسالًا ثانيًا ويعيد الحالة الحالية."
    note: "ينشر مباشرة (1.2.0، TEAM-DEC-013): لا مراجعة؛ يعيد listing.status = PUBLISHED وversion.status = APPROVED مع published_version_id = current_version_id وfirst_published_at وlast_published_at وnext_bump_at. DRAFT -> PUBLISHED (أول نشر يحتسب حد 5/24 ساعة ويطلق follow.new_listing)؛ PUBLISHED بمسودة تعديل -> تسري النسخة الجديدة فورًا دون اختفاء ودون رفع الترتيب. المخفي HIDDEN وغيره من الحالات غير DRAFT/PUBLISHED يرفع INVALID_STATE. يلزم أحد الرقمين contact_phone أو contact_whatsapp_phone على الأقل، ويبقى وقت الموافقة على نشر الرقم مطلوبًا؛ وإلا VALIDATION_FAILED بالحقلين."
    requirement: "AD-FR-003، AD-FR-008، AD-FR-009، AD-NFR-005"
    since: "0.1.0"
  submit_rating:
    description: "يقيّم معلنًا بدرجة 1 إلى 5 ونص اختياري وإقرار بتجربة تعامل، بعد تبادل رسائل. تقييم واحد لكل معلن."
    access: "user"
    arguments: "p_seller_id uuid, p_score integer, p_body text, p_declaration boolean, p_request_id uuid"
    returns: "jsonb"
    errors: [AUTH_REQUIRED, FORBIDDEN, ACCOUNT_SUSPENDED, VALIDATION_FAILED, RATING_NOT_ELIGIBLE, RATING_EXISTS]
    idempotency: "p_request_id: إعادة الطلب تعيد التقييم الأول. تقييم واحد لكل معلن."
    requirement: "AD-FR-029، AD-NFR-005"
    since: "1.0.0"
  submit_report:
    description: "يرسل بلاغًا عن إعلان أو حساب أو رسالة أو رد. التكرار بمعرف الطلب آمن؛ لا بلاغ عما لا يحق للمبلغ رؤيته."
    access: "user"
