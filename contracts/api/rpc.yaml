    errors: [AUTH_REQUIRED, FORBIDDEN, MFA_REQUIRED, NOT_FOUND, INVALID_STATE, VALIDATION_FAILED, BELOW_HARD_MINIMUM]
    requirement: "AD-FR-037"
    since: "0.1.0"
  admin_set_lookup_active:
