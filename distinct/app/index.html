<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFFFF">
<title>نوادر الإبل</title>
<link rel="icon" href="../logo-emblem.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#FFFFFF}
body{display:flex;align-items:center;justify-content:center}
body.dark{background:#111B1C}
#phone{display:block;width:100%;height:100dvh;border:0;background:inherit}
@media (min-width:520px){
  body{background:#EDE8DF}
  body.dark{background:#070C0D}
  #phone{width:390px;height:min(844px,calc(100dvh - 48px));border-radius:36px;box-shadow:0 0 0 10px #1B1713,0 24px 60px rgba(0,0,0,.35);background:#FFFFFF}
  body.dark #phone{background:#111B1C;box-shadow:0 0 0 10px #000,0 24px 60px rgba(0,0,0,.6)}
}
</style>
</head>
<body>
<iframe id="phone" title="نوادر الإبل" allow="clipboard-write"></iframe>
<script>
(() => {
  const IDS = new Set(['A00','A02','A03','A04','A05','B01','B02','B03','B04','B05','B08','B09','C01','C02','C04','C06','C07','C08','C09','D01','D02','D03','D04','D05','D06','D07','D08','D09','D10','D11','D12','E01','E03','E04','E05','E06','E07','E08','E09','F01','F02','F04','F05','F06','F07','F08','F09','G01','G02','G03','G04','G05','G06','G08','G09','G10','H05','H06','H07','H08','H09','H10']);
  const START = 'A00';
  const phone = document.getElementById('phone');
  let theme = 'light';
  let offer = 'price';
  let current = null;

  function paint() {
    document.body.classList.toggle('dark', theme === 'dark');
    document.querySelector('meta[name=theme-color]').content = theme === 'dark' ? '#111B1C' : '#FFFFFF';
  }
  function show(id) {
    if (!IDS.has(id)) id = START;
    current = id;
    paint();
    phone.src = '../screens/' + id + '-' + theme + '.html?offer=' + offer;
  }
  function fromHash() {
    const id = decodeURIComponent(location.hash.slice(1)).toUpperCase();
    show(IDS.has(id) ? id : START);
  }
  function go(id) {
    if (!IDS.has(id) || id === current) return;
    location.hash = id;
  }

  phone.addEventListener('load', () => phone.contentWindow.postMessage({ nawaderOffer: offer, nawaderTheme: theme }, '*'));
  addEventListener('hashchange', fromHash);
  addEventListener('message', e => {
    if (e.source !== phone.contentWindow) return;
    const d = e.data || {};
    if (['price', 'auction'].includes(d.nawaderOffer)) offer = d.nawaderOffer;
    if (['light', 'dark'].includes(d.nawaderThemeChoice)) { theme = d.nawaderThemeChoice; show(current || START); return; }
    if (d.nawaderScreen) go(d.nawaderScreen);
  });

  fromHash();
})();
</script>
</body>
</html>
