:root{--display:'Readex Pro','Tajawal',sans-serif;--r-img:12px;--shadow:0 8px 28px #2d241b24;--hair:color-mix(in srgb,var(--text) 9%,transparent)}

.field input:focus,.field select:focus,.field textarea:focus{border-bottom-color:var(--gold);outline:0}
.searchbar{height:48px;background:var(--soft);border:0;border-radius:99px;padding:0 14px}

.otp input{background:var(--soft);border:0;border-bottom:2px solid transparent;border-radius:14px}.otp input:focus{border-bottom-color:var(--gold);outline:0}
.radio-list,.grouped-list{background:var(--soft);border:0;border-radius:20px}

.composer{border-radius:99px;background:var(--soft);border:0}.bubble{border-radius:18px 18px 18px 4px;border:0;background:var(--soft)}.bubble.mine{border-radius:18px 18px 4px 18px}
dialog{border-radius:26px}.note{border-radius:16px}
.chip{background:var(--soft);border:0;border-radius:10px;min-height:38px;font-size:13px}

.badge{border-radius:99px;padding:3px 10px 3px 8px;gap:6px;align-items:center}

.badge.auction::before{width:7px;height:7px;border-radius:50%;border:2px solid currentColor}
.badge.fixed::before{width:10px;height:3px;border-radius:2px;background:currentColor}

.choice-cards .list-row{border:0;background:var(--soft);border-radius:20px}

/* خطوات النشر: سبع شرائح */
.seg-progress{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:-6px}
.seg-progress i{height:5px;border-radius:99px;background:var(--soft)}.seg-progress i.on{background:var(--gold)}
html[data-theme=dark] .seg-progress i{background:#ffffff1f}
.sheet-preview{border-radius:30px 30px 18px 18px}
.theme-swatch{border-radius:18px}
/* MOBILE-SPLASH-20261121 — شاشة البداية والانتقال إلى الرئيسية. تعمل مع الوضعين عبر متغيرات الألوان. */
html[data-theme=light]{--sp-d1:#F5F1EA;--sp-d2:#EEE6D9;--sp-l1:#E3D8C6;--sp-l2:#D9CCB6}
html[data-theme=dark]{--sp-d1:#18282A;--sp-d2:#213432;--sp-l1:#2E443F;--sp-l2:#385149}
html.sp-active,html.sp-active body{overflow:hidden}
html.sp-active .app{opacity:0}
html.sp-active .brand-lockup img{visibility:hidden}
#splash{position:fixed;inset:0;z-index:1000;overflow:hidden;color:var(--text)}
#splash .sp-veil{position:absolute;inset:0;background:var(--bg)}
#splash .sp-stage{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;padding:30px 20px calc(30px + 2vh)}
#splash .sp-emblem{display:block;width:clamp(132px,min(32vw,35vh),224px);height:auto;overflow:visible;transform-origin:0 0;will-change:transform}
#splash .sp-status{display:flex;align-items:center;gap:11px;margin:9px 0 0;color:var(--muted);font-size:14px;line-height:1.8}
#splash .sp-status::before,#splash .sp-status::after{content:"";width:22px;height:1px;background:var(--line)}
#splash .sp-dunes{position:absolute;inset:auto 0 0;width:100%;height:clamp(36px,13vh,125px);pointer-events:none}
#splash .sp-d1{fill:var(--sp-d1)}#splash .sp-d2{fill:var(--sp-d2)}
#splash .sp-dl1{stroke:var(--sp-l1)}#splash .sp-dl2{stroke:var(--sp-l2)}
#splash .sp-leg-fill{fill:var(--bg)}
/* المشي يظهر فقط عند تفعيل الحركة؛ وإلا يبقى الشعار ثابتًا. أثناء الانتقال يظهران معًا لتبديل ناعم. */
#splash #walking{display:none}
#splash.animated #walking{display:inline}
#splash.animated #still{display:none}
#splash.fly #walking,#splash.fly #still{display:inline}

/span></button><button data-go="F01" class="" aria-label="الرسائل"><svg class="icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8A8.5 8.5 0 0 1 12.5 20a8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg><span>الرسائل</span></button><button data-go="G01" class="" aria-label="حسابي"><svg class="icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a7 7 0 0 0-14 0v2M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0"/></svg><span>حسابي</span></button></nav><button data-go="D01" class="fab" aria-label="أضف إعلان"><svg class="icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>إعلان</span></button></div></div><dialog id="confirm-dialog"><h2 id="confirm-title">تأكيد الإجراء</h2><p>هذه معاينة تصميم، ولن ينفذ إجراء فعلي.</p><div class="stack"><button class="btn" data-dialog-close>حسنًا</button><button class="btn outline" data-dialog-close>إلغاء</button></div></dialog><script>(() => {
  const screen = document.body.dataset.screen;
  const urlOffer=new URLSearchParams(location.search).get('offer');
  let offer=['price','auction'].includes(urlOffer)?urlOffer:(screen==='D10'?'auction':'price');
  const go = id => {
    if(screen==='D04'&&id==='D05'&&offer==='auction')id='D06';
    if(screen==='D08'&&id==='D09'&&offer==='auction')id='D10';
    if(id)parent.postMessage({nawaderScreen:id,nawaderOffer:offer},'*');
  };
  document.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', () => {
    if(el.dataset.offer)offer=el.dataset.offer;
    go(el.dataset.go);
  }));
  document.querySelectorAll('[data-choice]').forEach(el => el.addEventListener('click', () => {
    el.parentElement.querySelectorAll('[data-choice]').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
  }));
  document.querySelectorAll('.switch').forEach(el => el.addEventListener('click', () => el.setAttribute('aria-checked',String(el.getAttribute('aria-checked')!=='true'))));
  document.querySelectorAll('[data-theme-choice]').forEach(el => el.addEventListener('click', () => {
    const value=el.dataset.themeChoice, theme=value==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):value;
    document.documentElement.dataset.theme=theme;
    parent.postMessage({nawaderThemeChoice:theme},'*');
  }));
  addEventListener('message', e => {
    if(e.source!==parent)return;
    if(['light','dark'].includes(e.data?.nawaderTheme))document.documentElement.dataset.theme=e.data.nawaderTheme;
    if(['price','auction'].includes(e.data?.nawaderOffer))offer=e.data.nawaderOffer;
  });
  document.querySelectorAll('[data-photo]').forEach(el => el.addEventListener('click', () => {document.querySelector('#media-main').src=el.dataset.photo;}));
  document.querySelector('#media-main')?.addEventListener('click', e=>e.target.classList.toggle('zoomed'));
  const dialog=document.querySelector('#confirm-dialog');
  document.querySelectorAll('[data-confirm]').forEach(el=>el.addEventListener('click',()=>{document.querySelector('#confirm-title').textContent=el.dataset.confirm;dialog.showModal();}));
  document.querySelectorAll('[data-dialog-close]').forEach(el=>el.addEventListener('click',()=>dialog.close()));
  document.querySelector('[data-unblock]')?.addEventListener('click',e=>{e.currentTarget.textContent='تم إلغاء الحظر';e.currentTarget.disabled=true;});
  document.querySelectorAll('[data-retry]').forEach(el=>el.addEventListener('click',()=>{el.textContent='إعادة المحاولة';}));
  document.querySelectorAll('[data-rating]').forEach(el=>el.addEventListener('click',()=>{
    document.querySelector('#rating-value').value=el.dataset.rating;
    document.querySelectorAll('[data-rating]').forEach(star=>star.classList.toggle('selected',Number(star.dataset.rating)<=Number(el.dataset.rating)));
    validate();
  }));
  const required=[...document.querySelectorAll('input[required],select[required],textarea[required]')];
  const channels=[...document.querySelectorAll('[data-channel]')];
  const primary=[...document.querySelectorAll('.actions>.btn:first-child,.content>.btn:not(.outline):not(.text):not(.ghost),.section>.btn.danger')].filter(el=>el.dataset.go||el.dataset.confirm);
  function validate(){
    const valid=required.every(el=>el.type==='checkbox'?el.checked:el.type==='file'?el.files.length>0:el.value.trim()!=='')&&(!channels.length||channels.some(el=>el.checked));
    primary.forEach(el=>{el.disabled=!valid;el.setAttribute('aria-disabled',String(!valid));});
  }
  [...required,...channels].forEach(el=>{el.addEventListener('input',validate);el.addEventListener('change',validate);});validate();
  // MOBILE-GUI-NOTES-20261118: تبويبات، قائمة النقاط الثلاث، تبديل شكل الإعلانات، وخانات الرمز.
  document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{
    const bar=el.parentElement,panels=[];let n=bar.nextElementSibling;
    while(n&&n.classList.contains('tab-panel')){panels.push(n);n=n.nextElementSibling;}
    bar.querySelectorAll('[data-tab]').forEach(t=>{const on=t===el;t.classList.toggle('active',on);t.setAttribute('aria-selected',String(on));});
    panels.forEach(p=>{p.hidden=p.dataset.panel!==el.dataset.tab;});
  }));
  document.querySelectorAll('[data-menu]').forEach(el=>{
    const menu=document.getElementById(el.dataset.menu);if(!menu)return;
    el.addEventListener('click',e=>{e.stopPropagation();menu.hidden=!menu.hidden;el.setAttribute('aria-expanded',String(!menu.hidden));});
    document.addEventListener('click',e=>{if(!menu.hidden&&!menu.contains(e.target)){menu.hidden=true;el.setAttribute('aria-expanded','false');}});
  });
  document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>{
    el.parentElement.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b===el));
    document.querySelectorAll('.ad-grid').forEach(g=>g.classList.toggle('compact',el.dataset.view==='compact'));
  }));
  const otp=[...document.querySelectorAll('.otp input')];
  otp.forEach((el,i)=>{
    el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(-1);if(el.value&&otp[i+1])otp[i+1].focus();});
    el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&otp[i-1])otp[i-1].focus();});
    el.addEventListener('paste',e=>{const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(!d)return;e.preventDefault();otp.forEach((o,k)=>{o.value=d[k]||'';});otp[Math.min(d.length,5)].focus();validate();});
  });
  document.querySelectorAll('form').forEach(form=>form.addEventListener('submit',e=>e.preventDefault()));
})();
